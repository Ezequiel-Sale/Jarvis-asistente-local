name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Jarvis usa APIs de Windows (Core Audio, Win32, WinRT): los tests se
    # ejecutan en Windows. No necesitan Docker, Ollama ni micrófono.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Buscar nombres sin definir
        # Un nombre sin importar (p. ej. un color del tema) solo falla al ejecutarse
        # esa línea; pyflakes lo detecta sin ejecutar nada.
        shell: pwsh
        run: |
          python -m pip install pyflakes==4.1.0
          $archivos = Get-ChildItem -Path jarvis_*.py, audio_capture.py, plugins/*.py
          $errores = python -m pyflakes $archivos | Select-String "undefined name"
          if ($errores) { $errores; exit 1 }
          exit 0

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -v
